name: Swing grader alerts

on:
  schedule:
    # 21:35 UTC = 5:35 PM ET in summer (EDT), 4:35 PM ET in winter (EST).
    # The script only scans once per trading day, after 4:20 PM ET.
    - cron: "35 21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false
      backtest:
        description: "Backtest all four setups (long + short) over 10 years (no alerts)"
        type: boolean
        default: false
      compare:
        description: "Compare growth strategies over 10 years: trend, momentum, TQQQ, breakouts (no alerts)"
        type: boolean
        default: false
      rescue:
        description: "Test holding losing trades until they're back to +5% (no alerts)"
        type: boolean
        default: false
      masters:
        description: "Backtest famous traders' swing systems: Qullamaggie, Turtle, Weinstein, Clenow (no alerts)"
        type: boolean
        default: false
      report:
        description: "Print swing outcome stats (no alerts)"
        type: boolean
        default: false
      force:
        description: "Scan now, ignoring the after-close time gate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grader
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.backtest && 60) || (inputs.compare && 20) || (inputs.rescue && 30) || (inputs.masters && 40) || 8 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Run grader
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RISK_USD: "0"          # set to e.g. "50" to see share sizes in the pushes
          # The swing grader now only sends breakout alerts; it no longer trades the Alpaca paper
          # account (no Alpaca keys here). The paper account runs the trend strategy (next step).
          # Pullbacks were turned off after their 10-yr edge came in below buy-and-hold.
          PUSH_SETUPS: "breakout"
          SHORT_REGIME: "any"    # "any" = shorts in any market, "bear" = only while SPY is below its 200-day
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: |
          if [ "${{ inputs.compare }}" = "true" ]; then python strategies.py; exit 0; fi
          if [ "${{ inputs.rescue }}" = "true" ]; then python rescue_test.py; exit 0; fi
          if [ "${{ inputs.masters }}" = "true" ]; then python swing_masters.py; exit 0; fi
          python grader.py \
            ${{ inputs.test && '--test' || '' }} \
            ${{ inputs.backtest && '--backtest' || '' }} \
            ${{ inputs.report && '--report' || '' }}

      - name: Trend trader (Alpaca paper account)
        if: ${{ always() && !inputs.test && !inputs.backtest && !inputs.compare && !inputs.rescue && !inputs.masters && !inputs.report }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TREND_TQQQ_PCT: "67"     # share of the invested money in TQQQ; the rest goes in QQQ
          TREND_INVEST_PCT: "100"  # % of paper equity invested while the signal is ON
          TREND_BAND_PCT: "5"      # rebalance when a holding drifts this many points of equity off target
          TREND_CLEAN_OTHERS: "1"  # close positions/orders that aren't part of the trend strategy
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python trend_trader.py

      - name: Save state and reports
        if: ${{ always() && !inputs.test && !inputs.report }}
        run: |
          git config user.name grader-bot
          git config user.email grader-bot@users.noreply.github.com
          for f in swing_state.json swing_alerts.csv swing_outcomes.csv swing_summary.md swing_backtest.md swing_bt_trades.csv paper_swing_trades.csv paper_swing_equity.csv strategies_report.md rescue_report.md swing_masters_report.md trend_state.json trend_trades.csv trend_equity.csv trend_last_run.md; do [ -f "$f" ] && git add "$f"; done; true
          git diff --staged --quiet || git commit -m "Update swing grader"
          git pull --rebase --autostash || true
          git push || true
