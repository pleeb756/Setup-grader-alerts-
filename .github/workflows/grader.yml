name: Swing grader alerts

on:
  schedule:
    # 20:35 and 21:35 UTC = 4:35 PM ET in summer (EDT) and winter (EST).
    # The script only scans once per trading day, after 4:20 PM ET.
    - cron: "35 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false
      backtest:
        description: "Backtest both setups over 10 years (no alerts)"
        type: boolean
        default: false
      report:
        description: "Print swing outcome stats (no alerts)"
        type: boolean
        default: false
      force:
        description: "Scan now, ignoring the after-close time gate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grader
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run grader
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RISK_USD: "0"          # set to e.g. "50" to see share sizes in the pushes
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: |
          python grader.py \
            ${{ inputs.test && '--test' || '' }} \
            ${{ inputs.backtest && '--backtest' || '' }} \
            ${{ inputs.report && '--report' || '' }}

      - name: Save state and reports
        if: ${{ always() && !inputs.test && !inputs.report }}
        run: |
          git config user.name grader-bot
          git config user.email grader-bot@users.noreply.github.com
          for f in swing_state.json swing_alerts.csv swing_outcomes.csv swing_summary.md swing_backtest.md swing_bt_trades.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --staged --quiet || git commit -m "Update swing grader"
          git pull --rebase --autostash || true
          git push || true
