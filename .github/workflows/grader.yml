{"name": "Setup grader alerts",
"on": {"schedule": [{"cron": "7,22,37,52 * * * *"}],
"workflow_dispatch": {"inputs": {
"test": {"description": "Send a test notification only", "type": "boolean", "default": false},
"backtest": {"description": "List past Sniper signals (no alerts)", "type": "boolean", "default": false}}}},
"permissions": {"contents": "write"},
"concurrency": {"group": "grader", "cancel-in-progress": false},
"jobs": {"grade": {"runs-on": "ubuntu-latest", "timeout-minutes": 10, "steps": [
{"uses": "actions/checkout@v5"},
{"uses": "actions/setup-python@v6", "with": {"python-version": "3.12", "cache": "pip"}},
{"run": "pip install -r requirements.txt"},
{"name": "Run grader", "env": {"NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}"}, "run": "python grader.py ${{ inputs.test && '--test' || '' }} ${{ inputs.backtest && '--backtest' || '' }}"},
{"name": "Save alert state", "if": "${{ !inputs.backtest }}", "run": "git config user.name grader-bot\ngit config user.email grader-bot@users.noreply.github.com\nfor f in state.json alerts_log.csv; do [ -f \"$f\" ] && git add \"$f\"; done\ngit diff --cached --quiet || (git commit -m 'Update alert state' && git push)"}
]}}}
