name: Swing grader alerts

on:
  schedule:
    # 21:35 UTC = 5:35 PM ET in summer (EDT), 4:35 PM ET in winter (EST).
    # The script only scans once per trading day, after 4:20 PM ET.
    - cron: "35 21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false
      backtest:
        description: "Backtest all four setups (long + short) over 10 years (no alerts)"
        type: boolean
        default: false
      report:
        description: "Print swing outcome stats (no alerts)"
        type: boolean
        default: false
      force:
        description: "Scan now, ignoring the after-close time gate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grader
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.backtest && 60 || 8 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Run grader
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RISK_USD: "0"          # set to e.g. "50" to see share sizes in the pushes
          # setups: pullback, breakout (long) and short_bounce, breakdown (short)
          # Pullbacks are off for pushes and paper trading: 10-yr backtest edge was below
          # buy-and-hold drift (+0.04R, -0.12% vs drift, 109R max drawdown) and the first 7
          # paper pullbacks all lost. They're still tracked silently in swing_outcomes.csv.
          PUSH_SETUPS: "breakout"
          PAPER_SETUPS: "breakout,short_bounce,breakdown"
          SHORT_REGIME: "any"    # "any" = shorts in any market, "bear" = only while SPY is below its 200-day
          # Alpaca PAPER account (leave the secrets unset to turn paper trading off)
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          PAPER_RISK_PCT: "2"      # breakouts: % of paper equity lost at a full stop ($40 on $2,000)
          PAPER_MAX_OPEN: "15"     # open breakout positions
          PAPER_SB_RISK_PCT: "1"   # short bounces: % of paper equity lost at a full stop (untested, so smaller)
          PAPER_SB_MAX_OPEN: "5"   # open short-bounce positions
          PAPER_BD_RISK_PCT: "1"   # breakdowns: % of paper equity lost at a full stop (untested, so smaller)
          PAPER_BD_MAX_OPEN: "10"  # open breakdown positions
          PAPER_MAX_POS_PCT: "35"  # cap on one position's size, % of paper equity
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: |
          python grader.py \
            ${{ inputs.test && '--test' || '' }} \
            ${{ inputs.backtest && '--backtest' || '' }} \
            ${{ inputs.report && '--report' || '' }}

      - name: Save state and reports
        if: ${{ always() && !inputs.test && !inputs.report }}
        run: |
          git config user.name grader-bot
          git config user.email grader-bot@users.noreply.github.com
          for f in swing_state.json swing_alerts.csv swing_outcomes.csv swing_summary.md swing_backtest.md swing_bt_trades.csv paper_swing_trades.csv paper_swing_equity.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --staged --quiet || git commit -m "Update swing grader"
          git pull --rebase --autostash || true
          git push || true
