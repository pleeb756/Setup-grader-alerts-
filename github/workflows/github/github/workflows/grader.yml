name: Setup grader alerts

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grader
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run grader
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python grader.py ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        run: |
          git config user.name "grader-bot"
          git config user.email "grader-bot@users.noreply.github.com"
          for f in state.json alerts_log.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Update alert state" && git push)
